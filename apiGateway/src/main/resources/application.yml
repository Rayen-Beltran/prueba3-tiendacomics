spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: ms-cliente-docs
          uri: lb://ms_cliente
          predicates:
            - Path=/ms_cliente/v3/api-docs
          filters:
            - RewritePath=/ms_cliente/v3/api-docs, /v3/api-docs

        - id: ms-comic-docs
          uri: lb://ms_comic
          predicates:
            - Path=/ms_comic/v3/api-docs
          filters:
            - RewritePath=/ms_comic/v3/api-docs, /v3/api-docs

        - id: tiendas-docs
          uri: lb://tiendas
          predicates:
            - Path=/tiendas/v3/api-docs
          filters:
            - RewritePath=/tiendas/v3/api-docs, /v3/api-docs

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    urls:
      - name: Cliente
        url: /ms_cliente/v3/api-docs
      - name: Comics
        url: /ms_comic/v3/api-docs
      - name: Tiendas
        url: /tiendas/v3/api-docs
  api-docs:
    path: /v3/api-docs
    enabled: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true